<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sci-Runner</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background: #070b1a;
            color: white;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #7dd3fc;
            letter-spacing: 1px;
        }

        p {
            color: #e5e7eb;
        }

        #score {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #facc15;
        }

        #game {
            width: 800px;
            height: 300px;
            border: 3px solid #7dd3fc;
            background: #020617;
            margin: auto;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(125, 211, 252, 0.45);
        }

        #game::before {
            content: "NaN     0.72     bias     NULL     95% CI     p=0.06     β₁     missing data     1010     error";
            position: absolute;
            top: 60px;
            left: -20px;
            width: 120%;
            color: rgba(125, 211, 252, 0.22);
            font-size: 18px;
            letter-spacing: 12px;
            animation: floatText 12s linear infinite;
            white-space: nowrap;
        }

        #game::after {
            content: "∑     σ²     DAG     bias     NaN     X→Y     404     missing     0/1     confounding";
            position: absolute;
            top: 150px;
            right: -30px;
            width: 120%;
            color: rgba(250, 204, 21, 0.20);
            font-size: 20px;
            letter-spacing: 14px;
            animation: floatTextReverse 14s linear infinite;
            white-space: nowrap;
        }

        @keyframes floatText {
            from { transform: translateX(-60px); }
            to { transform: translateX(80px); }
        }

        @keyframes floatTextReverse {
            from { transform: translateX(80px); }
            to { transform: translateX(-80px); }
        }

        #world {
            position: absolute;
            top: 10px;
            width: 100%;
            font-weight: bold;
            font-size: 22px;
            color: white;
            z-index: 3;
            text-shadow: 0 0 8px #7dd3fc;
        }

        #player {
            width: 90px;
            height: 50px;
            background: #1e3a8a;
            color: white;
            position: absolute;
            bottom: 0;
            left: 80px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            z-index: 5;
            box-shadow: 0 0 12px rgba(125, 211, 252, 0.8);
        }

        #obstacle {
            width: 70px;
            height: 45px;
            background: #ef4444;
            color: white;
            position: absolute;
            bottom: 0;
            right: -70px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            animation: moveObstacle 2.2s linear infinite;
            z-index: 5;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.8);
        }

        #savior {
            width: 85px;
            height: 48px;
            background: white;
            color: #1e3a8a;
            border: 2px solid #facc15;
            position: absolute;
            bottom: 70px;
            right: 40px;
            border-radius: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            z-index: 10;
            box-shadow: 0 0 18px rgba(250, 204, 21, 0.9);
        }

        #stars {
            position: absolute;
            bottom: 118px;
            right: 20px;
            width: 130px;
            height: 80px;
            display: none;
            z-index: 11;
            font-size: 22px;
            pointer-events: none;
        }

        #stars span {
            position: absolute;
            animation: sparkle 3s ease-out forwards;
        }

        #stars span:nth-child(1) { top: 5px; left: 10px; }
        #stars span:nth-child(2) { top: 25px; left: 55px; }
        #stars span:nth-child(3) { top: 0px; left: 90px; }
        #stars span:nth-child(4) { top: 45px; left: 25px; }
        #stars span:nth-child(5) { top: 50px; left: 100px; }

        @keyframes sparkle {
            0% {
                opacity: 0;
                transform: scale(0.4) rotate(0deg);
            }
            30% {
                opacity: 1;
                transform: scale(1.2) rotate(20deg);
            }
            100% {
                opacity: 0;
                transform: scale(1.8) rotate(90deg);
            }
        }

        @keyframes moveObstacle {
            from { right: -70px; }
            to { right: 850px; }
        }

        #message {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            min-height: 30px;
            color: #facc15;
        }

        button {
            padding: 10px 18px;
            background: #1e3a8a;
            color: white;
            border: 1px solid #7dd3fc;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #2563eb;
        }
    </style>
</head>

<body>

    <h1>Sci-Runner</h1>
    <p>Help Captain Causal survive Real World Data.</p>

    <div id="score">Your Score: 0</div>

    <div id="game">
        <div id="world">REAL WORLD DATA</div>
        <div id="player">Cap. Causal</div>
        <div id="obstacle">👹<br>Confounder</div>

        <div id="savior">✨<br>RCT</div>

        <div id="stars">
            <span>✨</span>
            <span>✨</span>
            <span>✨</span>
            <span>✨</span>
            <span>✨</span>
        </div>
    </div>

    <div id="message">Press SPACEBAR repeatedly to jump higher.</div>

    <button onclick="restartGame()">Restart</button>

    <script>
        const player = document.getElementById("player");
        const obstacle = document.getElementById("obstacle");
        const savior = document.getElementById("savior");
        const stars = document.getElementById("stars");
        const scoreDisplay = document.getElementById("score");
        const message = document.getElementById("message");
        const game = document.getElementById("game");

        let score = 0;
        let gameOver = false;
        let jumpLevel = 0;
        let isJumping = false;

        function jump() {
            if (gameOver) return;

            jumpLevel++;

            if (jumpLevel > 3) {
                jumpLevel = 3;
            }

            let jumpHeight = 90;

            if (jumpLevel === 2) {
                jumpHeight = 150;
            }

            if (jumpLevel === 3) {
                jumpHeight = 215;
            }

            isJumping = true;
            player.style.transition = "bottom 0.25s ease-out";
            player.style.bottom = jumpHeight + "px";

            setTimeout(() => {
                player.style.transition = "bottom 0.45s ease-in";
                player.style.bottom = "0px";

                setTimeout(() => {
                    isJumping = false;
                    jumpLevel = 0;
                }, 450);

            }, 350);
        }

        document.addEventListener("keydown", function(event) {
            if (event.code === "Space") {
                jump();
            }
        });

        game.addEventListener("click", jump);

        setInterval(() => {
            if (!gameOver) {
                score++;
                scoreDisplay.innerText = "Credibility Score: " + score;
            }
        }, 200);

        setInterval(() => {
            if (gameOver) return;

            const playerBottom = parseInt(window.getComputedStyle(player).getPropertyValue("bottom"));
            const obstacleLeft = obstacle.getBoundingClientRect().left;
            const playerLeft = player.getBoundingClientRect().left;
            const playerRight = player.getBoundingClientRect().right;

            if (
                obstacleLeft < playerRight &&
                obstacleLeft + 70 > playerLeft &&
                playerBottom < 45
            ) {
                gameOver = true;
                obstacle.style.animationPlayState = "paused";
                savior.style.display = "flex";
                stars.style.display = "block";

                message.innerText = "Game Over: Reviewer #2 requests additional analyses.";

                setTimeout(() => {
                    stars.style.display = "none";
                }, 3000);
            }
        }, 10);

        function restartGame() {
            score = 0;
            gameOver = false;
            jumpLevel = 0;
            isJumping = false;

            scoreDisplay.innerText = "Credibility Score: 0";
            message.innerText = "Press SPACEBAR repeatedly to jump higher.";
            savior.style.display = "none";
            stars.style.display = "none";
            player.style.bottom = "0px";

            obstacle.style.animation = "none";

            setTimeout(() => {
                obstacle.style.animation = "moveObstacle 2.2s linear infinite";
                obstacle.style.animationPlayState = "running";
            }, 50);
        }
    </script>

</body>
</html>
