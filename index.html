<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sci-Runner</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #1e3a8a;
        }

        #score {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        #game {
            width: 800px;
            height: 300px;
            border: 3px solid black;
            background: white;
            margin: auto;
            position: relative;
            overflow: hidden;
        }

        #world {
            position: absolute;
            top: 10px;
            width: 100%;
            font-weight: bold;
            font-size: 22px;
            color: #444;
        }

        #player {
            width: 90px;
            height: 50px;
            background: #1e3a8a;
            color: white;
            position: absolute;
            bottom: 0;
            left: 80px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
        }

        #obstacle {
            width: 70px;
            height: 45px;
            background: red;
            color: white;
            position: absolute;
            bottom: 0;
            right: -70px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            animation: moveObstacle 2.2s linear infinite;
        }

        #savior {
            width: 80px;
            height: 45px;
            background: #16a34a;
            color: white;
            position: absolute;
            bottom: 70px;
            right: 40px;
            border-radius: 8px;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
        }

        @keyframes moveObstacle {
            from { right: -70px; }
            to { right: 850px; }
        }

        #message {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            min-height: 30px;
        }

        button {
            padding: 10px 18px;
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <h1>Sci-Runner</h1>
    <p>Help Dr. Causal survive Real World Data.</p>

    <div id="score">Causal Confidence: 0</div>

    <div id="game">
        <div id="world">REAL WORLD DATA</div>
        <div id="player">Dr. Causal</div>
        <div id="obstacle">Confounder</div>
        <div id="savior">RCT</div>
    </div>

    <div id="message">Press SPACEBAR repeatedly to jump higher.</div>

    <button onclick="restartGame()">Restart</button>

    <script>
        const player = document.getElementById("player");
        const obstacle = document.getElementById("obstacle");
        const savior = document.getElementById("savior");
        const scoreDisplay = document.getElementById("score");
        const message = document.getElementById("message");
        const game = document.getElementById("game");

        let score = 0;
        let gameOver = false;
        let jumpLevel = 0;
        let isJumping = false;

        function jump() {
            if (gameOver) return;

            jumpLevel++;

            if (jumpLevel > 3) {
                jumpLevel = 3;
            }

            let jumpHeight = 90;

            if (jumpLevel === 2) {
                jumpHeight = 150;
            }

            if (jumpLevel === 3) {
                jumpHeight = 215;
            }

            isJumping = true;
            player.style.transition = "bottom 0.25s ease-out";
            player.style.bottom = jumpHeight + "px";

            setTimeout(() => {
                player.style.transition = "bottom 0.45s ease-in";
                player.style.bottom = "0px";

                setTimeout(() => {
                    isJumping = false;
                    jumpLevel = 0;
                }, 450);

            }, 350);
        }

        document.addEventListener("keydown", function(event) {
            if (event.code === "Space") {
                jump();
            }
        });

        game.addEventListener("click", jump);

        setInterval(() => {
            if (!gameOver) {
                score++;
                scoreDisplay.innerText = "Credibility score: " + score + "%";
            }
        }, 200);

        setInterval(() => {
            if (gameOver) return;

            const playerBottom = parseInt(window.getComputedStyle(player).getPropertyValue("bottom"));
            const obstacleLeft = obstacle.getBoundingClientRect().left;
            const playerLeft = player.getBoundingClientRect().left;
            const playerRight = player.getBoundingClientRect().right;

            if (
                obstacleLeft < playerRight &&
                obstacleLeft + 70 > playerLeft &&
                playerBottom < 45
            ) {
                gameOver = true;
                obstacle.style.animationPlayState = "paused";
                savior.style.display = "flex";
                message.innerText = "Game Over: Reviewer #2 requests additional analyses.";
            }
        }, 10);

        function restartGame() {
            score = 0;
            gameOver = false;
            jumpLevel = 0;
            isJumping = false;

            scoreDisplay.innerText = "Causal Confidence: 0";
            message.innerText = "Press SPACEBAR repeatedly to jump higher.";
            savior.style.display = "none";
            player.style.bottom = "0px";

            obstacle.style.animation = "none";

            setTimeout(() => {
                obstacle.style.animation = "moveObstacle 2.2s linear infinite";
                obstacle.style.animationPlayState = "running";
            }, 50);
        }
    </script>

</body>
</html>
