<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Data Scientist Runner</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
    }

    #game {
      width: 800px;
      height: 300px;
      border: 2px solid #222;
      margin: 30px auto;
      background: white;
      position: relative;
      overflow: hidden;
    }

    #player {
      width: 50px;
      height: 50px;
      background: #222;
      position: absolute;
      bottom: 0;
      left: 80px;
      border-radius: 8px;
    }

    #player::after {
      content: "DS";
      color: white;
      font-weight: bold;
      position: absolute;
      top: 15px;
      left: 12px;
    }

    #obstacle {
      width: 40px;
      height: 60px;
      background: crimson;
      position: absolute;
      bottom: 0;
      right: -40px;
      border-radius: 5px;
      animation: moveObstacle 2s linear infinite;
    }

    #obstacle::after {
      content: "NA";
      color: white;
      font-size: 14px;
      font-weight: bold;
      position: absolute;
      top: 20px;
      left: 8px;
    }

    @keyframes moveObstacle {
      from {
        right: -40px;
      }
      to {
        right: 840px;
      }
    }

    .jump {
      animation: jump 0.6s ease;
    }

    @keyframes jump {
      0% { bottom: 0; }
      50% { bottom: 120px; }
      100% { bottom: 0; }
    }

    #score {
      font-size: 22px;
      font-weight: bold;
    }

    #message {
      font-size: 16px;
      margin-top: 10px;
    }

    button {
      padding: 10px 18px;
      border: none;
      background: #222;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <h1>Data Scientist Runner</h1>
  <p>Jump over missing values and messy data.</p>

  <div id="score">Score: 0</div>

  <div id="game">
    <div id="player"></div>
    <div id="obstacle"></div>
  </div>

  <p id="message">Press Spacebar or click the game to jump.</p>
  <button onclick="restartGame()">Restart Game</button>

  <script>
    const player = document.getElementById("player");
    const obstacle = document.getElementById("obstacle");
    const scoreDisplay = document.getElementById("score");
    const message = document.getElementById("message");
    const game = document.getElementById("game");

    let score = 0;
    let gameOver = false;

    function jump() {
      if (!player.classList.contains("jump") && !gameOver) {
        player.classList.add("jump");

        setTimeout(() => {
          player.classList.remove("jump");
        }, 600);
      }
    }

    document.addEventListener("keydown", function(event) {
      if (event.code === "Space") {
        jump();
      }
    });

    game.addEventListener("click", jump);

    let scoreInterval = setInterval(() => {
      if (!gameOver) {
        score++;
        scoreDisplay.innerText = "Score: " + score;
      }
    }, 200);

    let collisionCheck = setInterval(() => {
      const playerBottom = parseInt(window.getComputedStyle(player).getPropertyValue("bottom"));
      const obstacleLeft = obstacle.getBoundingClientRect().left;
      const playerLeft = player.getBoundingClientRect().left;
      const playerRight = player.getBoundingClientRect().right;

      if (
        obstacleLeft < playerRight &&
        obstacleLeft + 40 > playerLeft &&
        playerBottom < 60
      ) {
        gameOver = true;
        obstacle.style.animationPlayState = "paused";
        message.innerText = "Game over. You hit messy data!";
      }
    }, 10);

    function restartGame() {
      score = 0;
      gameOver = false;
      scoreDisplay.innerText = "Score: 0";
      message.innerText = "Press Spacebar or click the game to jump.";
      obstacle.style.animation = "none";

      setTimeout(() => {
        obstacle.style.animation = "moveObstacle 2s linear infinite";
        obstacle.style.animationPlayState = "running";
      }, 50);
    }
  </script>

</body>
</html>
